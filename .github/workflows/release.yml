name: Publish verified Reins packages

on:
  workflow_dispatch:

permissions: {}

env:
  GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

concurrency:
  group: npm-publication
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify publication artifact
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the default branch dispatch
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "refs/heads/$GITHUB_DEFAULT_BRANCH"
          test -n "$GITHUB_SHA"
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        id: node-setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node-setup.outputs.node-version }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node-setup.outputs.node-version }}-${{ github.job }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node-setup.outputs.node-version }}-check-
      - name: Select the original verified candidate when available
        run: pnpm publication:candidate
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Run Full Check once with the selected candidate
        run: pnpm check:full
      - name: Verify publication handoff
        run: pnpm publication:readiness
        env:
          PUBLICATION_ARTIFACT_DIRECTORY: ${{ github.workspace }}/.artifacts/release
      - name: Save Turbo cache
        if: success() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - name: Upload verified npm artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-publication-${{ github.run_id }}
          path: .artifacts/release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified npm artifact
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          cache: true
      - name: Install publication tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download verified npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-publication-download
      - name: Publish the verified tgz with OIDC
        run: pnpm publication:publish
        env:
          PUBLICATION_ARTIFACT_DIRECTORY: ${{ runner.temp }}/npm-publication-download

  release:
    name: Create immutable GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          cache: true
      - name: Install publication tooling
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download verified npm artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-publication-release
      - name: Create immutable GitHub Release
        run: pnpm publication:release
        env:
          PUBLICATION_ARTIFACT_DIRECTORY: ${{ runner.temp }}/npm-publication-release
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
