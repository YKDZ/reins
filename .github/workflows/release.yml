name: Publish verified Reins packages

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-publication
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Build and verify release packages
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.full-check.outputs.release-version }}
      tag: ${{ steps.full-check.outputs.release-tag }}
      notes: ${{ steps.full-check.outputs.release-notes }}
    steps:
      - name: Require the default branch dispatch
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = "refs/heads/$GITHUB_DEFAULT_BRANCH"
          test -n "$GITHUB_SHA"
        env:
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      - name: Checkout the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        id: node-setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Set up pnpm
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          cache: true
      - name: Restore Turbo cache
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node-setup.outputs.node-version }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node-setup.outputs.node-version }}-${{ github.job }}-
            turbo-${{ runner.os }}-${{ runner.arch }}-node-${{ steps.node-setup.outputs.node-version }}-check-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the full release check
        id: full-check
        run: pnpm check:full
      - name: Save Turbo cache
        if: success() && steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}
      - name: Upload the verified package pair
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reins-publication-${{ github.run_id }}
          path: .artifacts/release/*.tgz
          if-no-files-found: error
          retention-days: 30

  publish-sdk:
    name: Publish the SDK package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Download the verified package pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reins-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/reins-publication
      - name: Publish the verified SDK tarball with OIDC
        run: npm publish "$RUNNER_TEMP/reins-publication/ykdz-reins-sdk-$RELEASE_VERSION.tgz" --access public --provenance --ignore-scripts
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}

  publish-runtime:
    name: Publish the runtime package
    needs: [verify, publish-sdk]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
      - name: Download the verified package pair
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reins-publication-${{ github.run_id }}
          path: ${{ runner.temp }}/reins-publication
      - name: Publish the verified runtime tarball with OIDC
        run: npm publish "$RUNNER_TEMP/reins-publication/ykdz-reins-$RELEASE_VERSION.tgz" --access public --provenance --ignore-scripts
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}

  release:
    name: Create the GitHub Release
    needs: [verify, publish-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          fetch-tags: false
      - name: Create the release tag at the selected commit
        run: |
          git tag "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      - name: Create the GitHub Release
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_TITLE: Reins ${{ needs.verify.outputs.version }}
          RELEASE_NOTES: ${{ needs.verify.outputs.notes }}
